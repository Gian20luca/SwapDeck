# Versione del plugin: uguale a [workspace.package] del Cargo.toml alla radice
# (controlli: task Gradle `checkVersion` in `check` e test/version.test.ts in `pnpm test`).
pluginVersion = 0.2.4

# Piattaforma per compilare: IntelliJ IDEA Community 2024.3 (build 243), nessun limite superiore.
platformType = IC
platformVersion = 2024.3.7
pluginSinceBuild = 243

# La libreria standard di Kotlin la fornisce l'IDE: non va nel plugin.
kotlin.stdlib.default.dependency = false

org.gradle.configuration-cache = true
org.gradle.caching = true
org.gradle.jvmargs = -Xmx2g -Dfile.encoding=UTF-8
