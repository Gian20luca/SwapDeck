[package]
name = "swapdeck-core"
description = "Logica di SwapDeck: client cswap, config, motore delle regole, lock, storico"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
directories = "6.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
thiserror = "2.0.21"
ts-rs = { version = "12.0.1", features = ["serde-json-impl", "no-serde-warnings"] }
zeroize = "1.9.1"

[target."cfg(unix)".dependencies]
rustix = { version = "1.1.5", features = ["process", "fs"] }

[dev-dependencies]
tempfile = "3.27.0"
