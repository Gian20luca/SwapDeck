[package]
name = "swapdeck-core"
description = "Logica di SwapDeck: client cswap, config, motore delle regole, lock, storico"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
directories = "6.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sysinfo = { version = "0.36.1", default-features = false, features = ["system"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
time = { version = "0.3.45", features = ["parsing", "formatting"] }
ts-rs = { version = "12.0.1", features = ["serde-json-impl", "no-serde-warnings"] }
# Notifiche di sistema di `--headless` (stessa versione del plugin di Tauri).
notify-rust = "4.17.0"
ureq = { version = "3.4.2", default-features = false, features = ["rustls", "platform-verifier"] }
zeroize = "1.9.1"

[target."cfg(unix)".dependencies]
rustix = { version = "1.1.5", features = ["process", "fs"] }

[dev-dependencies]
tempfile = "3.27.0"

# Finto cswap per i test di integrazione (tests/cswap_client.rs).
[[bin]]
name = "fake-cswap"
path = "tests/support/fake_cswap.rs"
test = false
doc = false
