# Verifiche su Windows (prioritario), Linux e macOS a ogni push e pull request.
name: CI

on:
  push:
    branches: ['**']
  pull_request:
  # Manuale: un solo sistema per le correzioni mirate (macOS costa 10 volte i minuti).
  workflow_dispatch:
    inputs:
      os:
        description: Sistema da verificare
        type: choice
        options: [tutti, windows-latest, ubuntu-22.04, macos-latest]
        default: tutti

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  CARGO_NET_RETRY: '10'
  RUST_BACKTRACE: short

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name != 'workflow_dispatch' || inputs.os == 'tutti') && '["windows-latest","ubuntu-22.04","macos-latest"]' || format('["{0}"]', inputs.os)) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Dipendenze di sistema (webkit2gtk per Tauri)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ci

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # Prima dei test: crea anche apps/desktop/dist, richiesta dal crate Tauri.
      - run: pnpm build
      - run: pnpm test

      - name: rustfmt
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  e2e:
    name: e2e (packages/ui)
    if: github.event_name != 'workflow_dispatch' || inputs.os == 'tutti' || inputs.os == 'ubuntu-22.04'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Chromium di Playwright
        run: pnpm --filter @swapdeck/ui exec playwright install --with-deps chromium
      - run: pnpm --filter @swapdeck/ui e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: e2e-results
          path: packages/ui/e2e/test-results/
          retention-days: 7
