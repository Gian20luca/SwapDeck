[workspace]
resolver = "3"
members = ["crates/swapdeck-core", "apps/desktop/src-tauri", "apps/cli"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Build di sviluppo leggere su disco: niente debuginfo per le dipendenze, solo righe per il workspace.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
